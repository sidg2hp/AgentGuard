name: agentguard-workspace
x-runtime: &runtime
  image: agentguard-workspace:local
  build: .
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 1g
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  volumes:
    - workspace-data:/app/state
  environment:
    AGENTGUARD_DB: /app/state/workspace.db
    AGENTGUARD_API_TOKEN: ${AGENTGUARD_API_TOKEN:?Set the workspace bearer token}
    AGENTGUARD_QUEUE_CAPACITY: ${AGENTGUARD_QUEUE_CAPACITY:-100}
    AGENTGUARD_ALLOW_MODEL: ${AGENTGUARD_ALLOW_MODEL:-0}
    AGENTGUARD_ALLOW_WEB: ${AGENTGUARD_ALLOW_WEB:-0}
    OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    TAVILY_API_KEY: ${AGENTGUARD_TAVILY_KEY:-}
  extra_hosts:
    - host.docker.internal:host-gateway
services:
  worker:
    <<: *runtime
    command: ["agentguard", "worker"]
    stop_grace_period: 2m
  api:
    <<: *runtime
    command: ["agentguard", "serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${AGENTGUARD_PORT:-8000}:8000"
    depends_on:
      - worker
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
volumes:
  workspace-data:
