services:
  benchmark:
    image: agentguard-workspace:local
    build: .
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 96
    mem_limit: 1g
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - benchmark-results:/app/results
volumes:
  benchmark-results:
