name: AgentGuard checks
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
      - run: uv run --frozen python -m evaluation.runner
      - uses: actions/upload-artifact@v4
        with:
          name: paired-benchmark
          path: results/benchmark.json
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --exit-code-from benchmark
      - run: docker compose cp benchmark:/app/results/benchmark.json sandbox-results.json
      - run: python -c "import json; runs = json.load(open('sandbox-results.json'))['runs']; assert len(runs) == 60 and all(r['status'] != 'error' for r in runs)"
